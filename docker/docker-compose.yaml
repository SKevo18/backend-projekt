services:
  backend: # FastAPI + uvicorn
    build: ../backend
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=app
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=app
    expose:
      - "8000"
    command: > # wait 2s for db to be ready
      /bin/sh -c "
      sleep 2;
      uvicorn main:API --host 0.0.0.0 --port 8000"
    depends_on:
      - db
    profiles: ["default", "https"]

  frontend:
    build: ../frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    profiles: ["default", "https"]

  frontend-https:
    build: ../frontend
    volumes:
      - ./nginx/nginx.https.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    profiles: ["https"]

  certbot:
    image: certbot/certbot
    volumes:
      - certs:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: > # check every 12 hours
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h & wait $${!};
      done"
    profiles: ["https"]

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    profiles: ["default", "https"]

volumes:
  db_data:
  certs:
